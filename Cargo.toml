[package]
name = "glyphflick"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A summon-pick-copy-disappear glyph picker for Wayland desktops"
repository = "https://github.com/sguzman/glyphflick"

[features]
default = []
timing = []

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland"] }
emojis = "=0.9.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
