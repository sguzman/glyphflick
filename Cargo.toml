[package]
name = "glyphflick"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A summon-pick-copy-disappear glyph picker for Wayland desktops"
repository = "https://github.com/sguzman/glyphflick"

[features]
default = []
timing = []
softbuffer-probe = ["dep:softbuffer"]

[dependencies]
egui = { git = "https://github.com/emilk/egui.git", rev = "f2de65f636cdc7bbf662b4a5482f1385ce2a0bb9", default-features = false }
egui_glow = { git = "https://github.com/emilk/egui.git", rev = "f2de65f636cdc7bbf662b4a5482f1385ce2a0bb9", default-features = false, features = ["winit", "wayland"] }
emojis = "=0.9.0"
epaint = { git = "https://github.com/emilk/egui.git", rev = "f2de65f636cdc7bbf662b4a5482f1385ce2a0bb9", default-features = false, features = ["color_fonts"] }
epaint_default_fonts = { git = "https://github.com/emilk/egui.git", rev = "f2de65f636cdc7bbf662b4a5482f1385ce2a0bb9", default-features = false }
glutin = { version = "=0.32.3", default-features = false, features = ["egl", "wayland"] }
glutin-winit = { version = "=0.5.0", default-features = false, features = ["egl", "wayland"] }
memmap2 = "=0.9.11"
# Probe-only software presenter; excluded from the normal production feature set.
softbuffer = { version = "=0.4.8", default-features = false, features = ["wayland"], optional = true }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "wayland"] }

[[bin]]
name = "glyphflick-softbuffer-probe"
path = "src/bin/softbuffer_probe.rs"
required-features = ["softbuffer-probe"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
