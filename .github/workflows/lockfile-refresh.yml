name: Lockfile Refresh Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lockfile-refresh.yml"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Generate canonical lockfile
        run: cargo generate-lockfile
      - name: Emit canonical lockfile
        shell: bash
        run: |
          echo "GLYPHFLICK_LOCK_BEGIN"
          cat Cargo.lock
          echo "GLYPHFLICK_LOCK_END"
