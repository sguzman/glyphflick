name: CI

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glyphflick-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Resolve dependencies
        run: cargo generate-lockfile

      - name: Check
        run: cargo check --locked

      - name: Fetch pinned outline emoji probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/font-probes
          font="target/font-probes/NotoEmoji-wght.ttf"
          curl --fail --location --retry 3 \
            --output "$font" \
            "https://raw.githubusercontent.com/google/fonts/b979dba422e445492b0eb9951ac52ee0b4d648c3/ofl/notoemoji/NotoEmoji%5Bwght%5D.ttf"
          test "$(stat -c %s "$font")" = "1982596"
          test "$(git hash-object "$font")" = "c2c26ab612a88a8610ff9cfbb89299bf2aea6c7a"

      - name: Test
        env:
          GLYPHFLICK_FONT_PROBE: target/font-probes/NotoEmoji-wght.ttf
        run: cargo test --locked -- --nocapture

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
