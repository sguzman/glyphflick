name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: glyphflick-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          subject="$(git log -1 --pretty=%s)"
          prefix="chore(release): prepare "

          if [[ "$subject" != "$prefix"* ]]; then
            echo "should_release=false" >>"$GITHUB_OUTPUT"
            echo "ordinary main commit; no release"
            exit 0
          fi

          expected="$prefix$version"
          if [[ "$subject" != "$expected" ]]; then
            echo "release commit subject mismatch" >&2
            echo "expected: $expected" >&2
            echo "actual:   $subject" >&2
            exit 1
          fi

          tag="v$version"
          remote_sha="$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')"
          if [[ -n "$remote_sha" && "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "$tag already points to $remote_sha, not $GITHUB_SHA" >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published" >&2
            exit 1
          fi

          echo "should_release=true" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - name: Install native build dependencies
        if: steps.release.outputs.should_release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-color-emoji \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust
        if: steps.release.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        if: steps.release.outputs.should_release == 'true'
        run: cargo fmt --all -- --check

      - name: Validate probe shells
        if: steps.release.outputs.should_release == 'true'
        run: bash -n scripts/*.sh

      - name: Check
        if: steps.release.outputs.should_release == 'true'
        run: cargo check --locked

      - name: Test
        if: steps.release.outputs.should_release == 'true'
        run: cargo test --locked -- --nocapture

      - name: Clippy
        if: steps.release.outputs.should_release == 'true'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Reject forbidden runtime dependencies
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree --locked --prefix none)"
          forbidden='^(arboard|smithay-clipboard|x11-dl|x11rb|wgpu|glow|egui_glow|glutin|glutin-winit|glutin_egl_sys|glutin_glx_sys|khronos-egl)( |$)'
          if grep -E "$forbidden" <<<"$tree"; then
            echo "Forbidden latency/platform dependency detected" >&2
            exit 1
          fi

      - name: Build release binary
        if: steps.release.outputs.should_release == 'true'
        run: cargo build --release --locked --bin glyphflick

      - name: Package versioned executable
        if: steps.release.outputs.should_release == 'true'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          target="x86_64-unknown-linux-gnu"
          stem="glyphflick-v${version}-${target}"

          mkdir -p "dist/${stem}"
          install -m 0755 target/release/glyphflick "dist/${stem}/glyphflick"
          tar -C dist -czf "dist/${stem}.tar.gz" "${stem}"
          sha256sum "dist/${stem}.tar.gz" >"dist/${stem}.tar.gz.sha256"

          echo "archive=${stem}.tar.gz" >>"$GITHUB_OUTPUT"
          echo "checksum=${stem}.tar.gz.sha256" >>"$GITHUB_OUTPUT"

          file target/release/glyphflick
          stat -c 'release_bytes=%s' target/release/glyphflick

      - name: Build release notes
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"

          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md >release-notes.md

          cat >>release-notes.md <<'EOF'

          ### Distribution

          The attached x86_64 GNU/Linux archive contains the stripped `glyphflick` executable built from this exact release commit.

          Runtime requirements: Wayland, `wl-copy` from `wl-clipboard`, and Noto Color Emoji at a supported system path.
          EOF

      - name: Publish GitHub Release
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          archive="dist/${{ steps.package.outputs.archive }}"
          checksum="dist/${{ steps.package.outputs.checksum }}"

          gh release create "$tag" \
            "$archive#Linux x86_64 (glibc)" \
            "$checksum#SHA-256" \
            --target "$GITHUB_SHA" \
            --title "Glyphflick $tag" \
            --notes-file release-notes.md
